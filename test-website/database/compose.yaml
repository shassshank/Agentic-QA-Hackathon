services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demobank
      POSTGRES_USER: demobank
      POSTGRES_PASSWORD: demobank_local
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demobank -d demobank"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - demobank_postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_schema.sql:/docker-entrypoint-initdb.d/001_create_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro

volumes:
  demobank_postgres_data:
