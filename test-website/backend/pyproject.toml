[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "demobank-backend"
version = "0.1.0"
description = "FastAPI service for the DemoBank application"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "uvicorn[standard]>=0.32,<1",
]

[tool.setuptools.packages.find]
include = ["demobank*"]
