<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Audit Report</title>
  <style>
    :root {
      --bg: #f8fafc; --bg-card: #ffffff; --bg-subtle: #f1f5f9; --bg-hover: #e2e8f0;
      --border: #cbd5e1; --border-subtle: #e2e8f0; --text: #0f172a; --text-muted: #475569; --text-dim: #64748b;
      --primary: #2563eb; --primary-hover: #1d4ed8; --primary-subtle: #eff6ff;
      --pass-bg: #ecfdf5; --pass-border: #a7f3d0; --pass-text: #065f46; --pass-solid: #059669;
      --fail-bg: #fff1f2; --fail-border: #fecdd3; --fail-text: #9f1239; --fail-solid: #e11d48;
      --unverified-bg: #f8fafc; --unverified-border: #cbd5e1; --unverified-text: #334155; --unverified-solid: #64748b;
      --badge-bg: #f1f5f9; --badge-border: #cbd5e1; --badge-text: #334155;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
      --radius: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16; --bg-card: #111827; --bg-subtle: #1e293b; --bg-hover: #334155;
        --border: #334155; --border-subtle: #1f293d; --text: #f1f5f9; --text-muted: #94a3b8; --text-dim: #64748b;
        --primary: #3b82f6; --primary-hover: #60a5fa; --primary-subtle: #172554;
        --pass-bg: rgba(6,78,59,0.25); --pass-border: #047857; --pass-text: #6ee7b7; --pass-solid: #10b981;
        --fail-bg: rgba(136,19,55,0.25); --fail-border: #be123c; --fail-text: #fda4af; --fail-solid: #f43f5e;
        --unverified-bg: #1e293b; --unverified-border: #475569; --unverified-text: #cbd5e1; --unverified-solid: #94a3b8;
        --badge-bg: #1e293b; --badge-border: #334155; --badge-text: #cbd5e1;
        --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.4); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.4);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 1.5rem; max-width: 1320px; margin: 0 auto; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .section-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; box-shadow: var(--shadow-sm); }
    .section-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.75rem; }
    .section-header h2 { font-size: 1.35rem; font-weight: 700; }
    .section-desc { color: var(--text-muted); font-size: 0.9rem; }

    .report-header { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
    .report-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border-subtle); }
    .meta-item { display: flex; flex-direction: column; gap: 0.2rem; }
    .meta-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); font-weight: 600; }
    .meta-val { font-size: 0.95rem; font-weight: 500; overflow-wrap: anywhere; }
    .mono { font-family: var(--font-mono); font-size: 0.88rem; }

    .badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.55rem; border-radius: 4px; font-size: 0.78rem; font-weight: 600; border: 1px solid transparent; line-height: 1.2; white-space: nowrap; }
    .badge-pass { background: var(--pass-bg); border-color: var(--pass-border); color: var(--pass-text); }
    .badge-fail { background: var(--fail-bg); border-color: var(--fail-border); color: var(--fail-text); }
    .badge-unverified { background: var(--unverified-bg); border-color: var(--unverified-border); color: var(--unverified-text); }
    .badge-unknown { background: var(--bg-subtle); border-color: var(--border); color: var(--text-dim); }
    .badge-area { background: var(--bg-subtle); border-color: var(--border); color: var(--text); font-family: var(--font-mono); }
    .badge-bullet { background: var(--primary-subtle); border-color: var(--primary); color: var(--primary); font-family: var(--font-mono); }
    .badge-cov-full { background: var(--pass-bg); border-color: var(--pass-border); color: var(--pass-text); }
    .badge-cov-part { background: #fef3c7; border-color: #fde68a; color: #92400e; }
    .badge-cov-none { background: var(--bg-subtle); border-color: var(--border); color: var(--text-dim); }
    .badge-kind { font-size: 0.72rem; text-transform: uppercase; background: var(--bg-subtle); border-color: var(--border); }
    .badge-kind-negative { border-color: #fca5a5; color: #b91c1c; }
    .badge-kind-edge { border-color: #c4b5fd; color: #6d28d9; }

    .tiles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .tile { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; gap: 0.35rem; box-shadow: var(--shadow-sm); }
    .tile-num { font-size: 2.25rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
    .tile-label { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
    .tile-pass { border-top: 4px solid var(--pass-solid); } .tile-pass .tile-num { color: var(--pass-solid); }
    .tile-fail { border-top: 4px solid var(--fail-solid); } .tile-fail .tile-num { color: var(--fail-solid); }
    .tile-unverified { border-top: 4px solid var(--unverified-solid); } .tile-unverified .tile-num { color: var(--unverified-solid); }
    .tile-total { border-top: 4px solid var(--primary); }

    .bar-stack { height: 10px; width: 100%; background: var(--bg-subtle); border-radius: 9999px; overflow: hidden; display: flex; margin: 0.5rem 0; }
    .bar-segment { height: 100%; }
    .bar-seg-pass { background: var(--pass-solid); }
    .bar-seg-fail { background: var(--fail-solid); }
    .bar-seg-unverified { background: var(--unverified-solid); }

    .summary-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    @media (max-width: 860px) { .summary-details-grid { grid-template-columns: 1fr; } }
    .area-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .area-table th, .area-table td { padding: 0.45rem 0.6rem; text-align: left; border-bottom: 1px solid var(--border-subtle); }
    .area-table th { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
    .area-bar-col { width: 120px; }
    .reasons-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.9rem; }
    .reason-item { display: flex; gap: 0.5rem; align-items: flex-start; }
    .reason-count { font-weight: 700; color: var(--text); min-width: 2.2rem; }
    .reason-text { color: var(--text-muted); }
    .how-to-read { background: var(--bg-subtle); border-left: 4px solid var(--primary); padding: 0.85rem 1.15rem; border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.88rem; color: var(--text-muted); }
    .how-to-read strong { color: var(--text); }

    .failure-card { background: var(--bg-card); border: 1px solid var(--fail-border); border-left: 5px solid var(--fail-solid); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
    .failure-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    .failure-title-wrap { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
    .failure-id { font-family: var(--font-mono); font-weight: 700; font-size: 1.15rem; color: var(--fail-text); }
    .failure-title { font-size: 1.15rem; font-weight: 700; }
    .review-pill { background: var(--fail-bg); border: 1px solid var(--fail-border); color: var(--fail-text); padding: 0.3rem 0.65rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; font-family: var(--font-mono); }
    blockquote.prd-quote { background: var(--bg-subtle); border-left: 3px solid var(--border); padding: 0.65rem 1rem; margin: 0.75rem 0 1rem 0; font-style: italic; color: var(--text-muted); border-radius: 0 4px 4px 0; font-size: 0.92rem; }
    .quote-footer { margin-top: 0.35rem; display: flex; gap: 0.35rem; font-style: normal; }
    .repro-steps { margin: 0.75rem 0 1rem 1.25rem; font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.35rem; }

    .data-table-wrap { overflow-x: auto; margin: 0.75rem 0; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
    .data-table th, .data-table td { padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border-subtle); vertical-align: top; }
    .data-table th { background: var(--bg-subtle); color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
    .data-table tbody tr:hover { background: var(--bg-subtle); }
    .obs-code { font-family: var(--font-mono); font-size: 0.8rem; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 0.4rem 0.6rem; max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; color: var(--text); }

    .shots-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin: 1rem 0; }
    .shot-thumb-card { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; transition: transform 0.15s, border-color 0.15s; }
    .shot-thumb-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .shot-thumb-img { width: 100%; height: 160px; object-fit: cover; display: block; background: #000; }
    .shot-thumb-caption { padding: 0.5rem 0.75rem; font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }

    details.sub-details { margin: 0.75rem 0; border: 1px solid var(--border-subtle); border-radius: 6px; background: var(--bg-subtle); }
    details.sub-details > summary { padding: 0.5rem 0.75rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); user-select: none; }
    details.sub-details > summary:hover { color: var(--text); }
    details.sub-details[open] > summary { border-bottom: 1px solid var(--border-subtle); }
    details.sub-details .sub-content { padding: 0.75rem; overflow-x: auto; }

    .filters-toolbar { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-subtle); border-radius: var(--radius); border: 1px solid var(--border-subtle); }
    .search-box { flex: 1; min-width: 200px; padding: 0.45rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); color: var(--text); font-size: 0.88rem; }
    .filter-group { display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; }
    .filter-chip { padding: 0.35rem 0.75rem; border-radius: 9999px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .filter-chip:hover { border-color: var(--primary); color: var(--text); }
    .filter-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .filter-select { padding: 0.4rem 0.65rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 0.85rem; }
    .filter-count { font-size: 0.82rem; color: var(--text-dim); margin-left: auto; }

    .req-row-main { cursor: pointer; }
    .req-row-detail { background: var(--bg-subtle); }
    .req-detail-container { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; border-left: 3px solid var(--primary); }
    .req-expand-btn { background: none; border: none; cursor: pointer; font-weight: bold; color: var(--text-dim); padding: 0.2rem 0.4rem; border-radius: 4px; }
    .req-expand-btn:hover { background: var(--bg-hover); color: var(--text); }

    .probe-card { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.85rem; background: var(--bg-card); overflow: hidden; }
    .probe-card > summary { padding: 0.85rem 1.15rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; background: var(--bg-card); user-select: none; }
    .probe-card > summary:hover { background: var(--bg-subtle); }
    .probe-card[open] > summary { border-bottom: 1px solid var(--border-subtle); background: var(--bg-subtle); }
    .probe-summary-left { display: flex; align-items: baseline; gap: 0.65rem; flex-wrap: wrap; }
    .probe-summary-right { display: flex; align-items: center; gap: 0.5rem; }
    .probe-body { padding: 1.25rem; }
    .step-item { display: flex; gap: 0.5rem; align-items: baseline; font-size: 0.9rem; padding: 0.2rem 0; }
    .step-item.step-failed { color: var(--fail-solid); font-weight: 600; }
    .step-num { color: var(--text-dim); min-width: 1.8rem; font-family: var(--font-mono); font-size: 0.82rem; }

    @keyframes pulseHighlight { 0% { box-shadow: 0 0 0 4px var(--primary); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .highlight-pulse { animation: pulseHighlight 2s ease-out; }

    .lightbox-dialog { border: 1px solid var(--border); border-radius: var(--radius); padding: 0; background: var(--bg-card); color: var(--text); max-width: 90vw; max-height: 90vh; margin: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .lightbox-dialog::backdrop { background: rgba(0,0,0,0.75); backdrop-filter: blur(2px); }
    .lightbox-header { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border-subtle); }
    .lightbox-title { font-weight: 600; font-size: 0.95rem; }
    .lightbox-close-btn { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 4px; padding: 0.25rem 0.6rem; cursor: pointer; font-size: 0.85rem; }
    .lightbox-close-btn:hover { background: var(--bg-hover); }
    .lightbox-body { padding: 1rem; display: flex; justify-content: center; align-items: center; max-height: calc(90vh - 70px); overflow: auto; }
    .lightbox-img { max-width: 100%; max-height: 75vh; object-fit: contain; border-radius: 4px; }

    .warning-box { background: #fffbeb; border: 1px solid #fde68a; border-left: 4px solid #f59e0b; color: #92400e; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.9rem; }
    @media (prefers-color-scheme: dark) { .warning-box { background: rgba(245,158,11,0.15); border-color: #b45309; color: #fde68a; } }

    @media print {
      body { background: #fff !important; color: #000 !important; padding: 0 !important; font-size: 10pt; }
      .filters-toolbar, .lightbox-dialog, .req-expand-btn, button { display: none !important; }
      .section-card, .failure-card, .probe-card, .tile { box-shadow: none !important; border: 1px solid #ddd !important; page-break-inside: avoid; break-inside: avoid; }
      details { display: block !important; }
      details > :not(summary) { display: block !important; }
      details > summary { cursor: default; }
      .req-row-detail { display: table-row !important; }
    }
  </style>
</head>
<body>
  <script id="report-data" type="application/json">/*__REPORT_DATA__*/</script>
  <header id="report-header" class="report-header"></header>
  <main id="report-main"></main>

  <dialog id="lightbox" class="lightbox-dialog" aria-label="Screenshot lightbox">
    <div class="lightbox-header">
      <span id="lightbox-caption" class="lightbox-title"></span>
      <button type="button" id="lightbox-close" class="lightbox-close-btn" aria-label="Close dialog">✕ Close</button>
    </div>
    <div class="lightbox-body"><img id="lightbox-img" class="lightbox-img" alt="Enlarged screenshot"></div>
  </dialog>

  <script>
    (function() {
      'use strict';
      function el(tag, props, ...children) {
        const node = document.createElement(tag);
        if (props) {
          for (const [k, v] of Object.entries(props)) {
            if (v == null || v === false) continue;
            if (k === 'className') node.className = v;
            else if (k === 'textContent') node.textContent = v;
            else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
            else if (k === 'dataset' && typeof v === 'object') {
              for (const [dk, dv] of Object.entries(v)) node.dataset[dk] = dv;
            } else node.setAttribute(k, v);
          }
        }
        for (const c of children.flat(Infinity)) {
          if (c == null || c === false) continue;
          if (typeof c === 'string' || typeof c === 'number') node.appendChild(document.createTextNode(String(c)));
          else if (c instanceof Node) node.appendChild(c);
        }
        return node;
      }

      function formatTime(iso) {
        if (!iso) return '—';
        try {
          const d = new Date(iso);
          return isNaN(d) ? iso : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short', timeZone: 'UTC' }) + ' UTC';
        } catch { return iso; }
      }
      function formatUsd(val) { return val == null ? 'unpriced' : '$' + Number(val).toFixed(6); }
      function formatNum(n) { return n != null ? Number(n).toLocaleString() : '0'; }

      function statusBadge(status) {
        const s = String(status || '').toLowerCase();
        if (s === 'passed' || s === 'pass') return el('span', { className: 'badge badge-pass' }, '✓ PASS');
        if (s === 'failed' || s === 'fail') return el('span', { className: 'badge badge-fail' }, '✗ FAIL');
        if (s === 'unverified') return el('span', { className: 'badge badge-unverified' }, '? UNVERIFIED');
        return el('span', { className: 'badge badge-unknown' }, `? ${status || 'UNKNOWN'}`);
      }

      function coverageBadge(cov) {
        const c = String(cov || 'none').toLowerCase();
        const cls = c === 'full' ? 'badge-cov-full' : (c === 'partial' ? 'badge-cov-part' : 'badge-cov-none');
        return el('span', { className: `badge ${cls}` }, c === 'full' ? 'Full Coverage' : (c === 'partial' ? 'Partial' : 'No Coverage'));
      }

      function kindBadge(kind) { return el('span', { className: `badge badge-kind badge-kind-${kind || 'normal'}` }, kind || 'normal'); }

      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');
      const lightboxClose = document.getElementById('lightbox-close');

      function openLightbox(src, caption) {
        if (typeof src === 'string' && src.startsWith('data:image/')) {
          lightboxImg.setAttribute('src', src);
          lightboxImg.setAttribute('alt', caption || 'Screenshot');
          lightboxCaption.textContent = caption || 'Screenshot';
          if (typeof lightbox.showModal === 'function') lightbox.showModal();
          else lightbox.setAttribute('open', 'true');
        }
      }
      lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.close(); });
      lightboxClose.addEventListener('click', () => lightbox.close());

      let data = {};
      try {
        data = JSON.parse(document.getElementById('report-data').textContent);
      } catch (err) {
        document.body.appendChild(el('div', { className: 'warning-box' }, 'Failed to parse report data payload: ' + err.message));
        return;
      }

      const meta = data.meta || {}, summary = data.summary || {}, requirements = data.requirements || [];
      const probes = data.probes || {}, cost = data.cost || {}, reasons = data.reasons || {}, warnings = data.warnings || [];

      // 1. Header
      const headerEl = document.getElementById('report-header');
      headerEl.appendChild(el('div', { className: 'header-top' },
        el('div', null,
          el('h1', { className: 'report-title' }, meta.title || 'DemoBank QA Audit Report'),
          el('div', { className: 'meta-val', style: 'color: var(--text-muted); margin-top: 0.25rem;' },
            'Autonomous QA verification against Product Requirements Document'
          )
        )
      ));

      const prdSha = meta.catalogue && meta.catalogue.prd_sha256 ? meta.catalogue.prd_sha256.slice(0, 10) : '—';
      headerEl.appendChild(el('div', { className: 'meta-grid' },
        el('div', { className: 'meta-item' }, el('span', { className: 'meta-label' }, 'Target URL'),
          el('span', { className: 'meta-val mono' }, meta.target_url ? el('a', { href: meta.target_url, target: '_blank', rel: 'noopener' }, meta.target_url) : '—')),
        el('div', { className: 'meta-item' }, el('span', { className: 'meta-label' }, 'Run Tag'), el('span', { className: 'meta-val mono' }, meta.run_tag || '—')),
        el('div', { className: 'meta-item' }, el('span', { className: 'meta-label' }, 'PRD Hash'), el('span', { className: 'meta-val mono', title: meta.catalogue?.prd_sha256 || '' }, prdSha)),
        el('div', { className: 'meta-item' }, el('span', { className: 'meta-label' }, 'Scenarios Completed'), el('span', { className: 'meta-val' }, `${meta.probes_completed || 0} / ${meta.probes_total || 0} (${meta.probe_runtime_s || 0}s)`)),
        el('div', { className: 'meta-item' }, el('span', { className: 'meta-label' }, 'Generated At'), el('span', { className: 'meta-val' }, formatTime(meta.generated_at)))
      ));

      const mainEl = document.getElementById('report-main');
      if (warnings.length > 0) {
        mainEl.appendChild(el('div', { className: 'warning-box' },
          el('strong', null, 'Warnings:'),

      mainEl.appendChild(allReqsSec);

                shotsContainer.appendChild(el('div', { className: 'shot-thumb-card', onclick: () => openLightbox(shot.src, shot.caption) },
                  el('img', { className: 'shot-thumb-img', src: shot.src, alt: shot.caption || 'Scenario screenshot', loading: 'lazy' }),
                  el('div', { className: 'shot-thumb-caption' }, shot.caption || shot.name)
                ));
              }
            }
          }
        });

        if (p.screenshots && p.screenshots.length > 0) {
          pBody.appendChild(el('h4', { style: 'font-size: 0.9rem; margin-top: 0.75rem;' }, `Evidence Screenshots (${p.screenshots.length}):`));
          pBody.appendChild(shotsContainer);
        }

        if (p.network && p.network.length > 0) {
          pBody.appendChild(el('details', { className: 'sub-details' },
            el('summary', null, `API & Network Calls (${p.network.length})`),
            el('div', { className: 'sub-content' }, renderNetworkTable(p.network))
          ));
        }

        if (p.console && p.console.length > 0) {
          pBody.appendChild(el('details', { className: 'sub-details' },
            el('summary', null, `Browser Console Output (${p.console.length})`),
            el('div', { className: 'sub-content' }, el('pre', { className: 'obs-code' }, p.console.join('\n')))
          ));
        }

        if (p.recoveries && p.recoveries.length > 0) {
          pBody.appendChild(el('div', { className: 'warning-box', style: 'margin-top: 0.75rem;' },
            el('strong', null, 'Auto-Recoveries: '),
            el('pre', { className: 'obs-code', style: 'margin-top: 0.5rem;' }, JSON.stringify(p.recoveries, null, 2))
          ));
        }

        pDetails.appendChild(pBody);
        probesContainer.appendChild(pDetails);
      }
      probesSec.appendChild(probesContainer);
      mainEl.appendChild(probesSec);

      // 6. Cost Section
      const costSec = el('section', { className: 'section-card' },
        el('div', { className: 'section-header' },
          el('h2', null, 'Execution Cost & LLM Usage'),
          el('span', { className: 'section-desc' }, 'Model token telemetry and dollar expenditures by phase')
        )
      );

      const costTableWrap = el('div', { className: 'data-table-wrap' });
      const costTable = el('table', { className: 'data-table' },
        el('thead', null, el('tr', null,
          el('th', null, 'Phase'), el('th', null, 'Provider'), el('th', null, 'Models'),
          el('th', { style: 'text-align: right;' }, 'Calls'), el('th', { style: 'text-align: right;' }, 'Cached'),
          el('th', { style: 'text-align: right;' }, 'Input Tokens'), el('th', { style: 'text-align: right;' }, 'Output Tokens'),
          el('th', { style: 'text-align: right;' }, 'This run (USD)'), el('th', { style: 'text-align: right;' }, 'Cold run (USD)')
        ))
      );
      const costTbody = el('tbody');
      const phases = cost.phases || [];
      const coldOf = p => (p.cold_cost_usd !== undefined ? p.cold_cost_usd : p.cost_usd);
      for (const ph of phases) {
        costTbody.appendChild(el('tr', null,
          el('td', { style: 'font-weight: 600;' }, ph.phase),
          el('td', null, el('span', { className: 'badge badge-area' }, ph.provider || '—')),
          el('td', { className: 'mono', style: 'font-size: 0.82rem;' }, ph.models && ph.models.length > 0 ? ph.models.join(', ') : '—'),
          el('td', { style: 'text-align: right;' }, formatNum(ph.calls)),
          el('td', { style: 'text-align: right;' }, formatNum(ph.cached_calls || 0)),
          el('td', { style: 'text-align: right;' }, formatNum(ph.input_tokens)),
          el('td', { style: 'text-align: right;' }, formatNum(ph.output_tokens)),
          el('td', { style: 'text-align: right; font-weight: 600;' }, formatUsd(ph.cost_usd)),
          el('td', { style: 'text-align: right; font-weight: 600;' }, formatUsd(coldOf(ph)))
        ));
      }

      const sum = key => phases.reduce((acc, p) => acc + (p[key] || 0), 0);
      const usd = v => (v != null ? `$${Number(v).toFixed(6)}` : 'unpriced');
      costTbody.appendChild(el('tr', { style: 'font-weight: 800; background: var(--bg-subtle); border-top: 2px solid var(--border);' },
        el('td', { colSpan: 3 }, 'Total Auditing Cost'),
        el('td', { style: 'text-align: right;' }, formatNum(sum('calls'))),
        el('td', { style: 'text-align: right;' }, formatNum(sum('cached_calls'))),
        el('td', { style: 'text-align: right;' }, formatNum(sum('input_tokens'))),
        el('td', { style: 'text-align: right;' }, formatNum(sum('output_tokens'))),
        el('td', { style: 'text-align: right; color: var(--primary); font-size: 1.05rem;' }, usd(cost.total_usd)),
        el('td', { style: 'text-align: right; color: var(--primary); font-size: 1.05rem;' },
          usd(cost.cold_total_usd !== undefined ? cost.cold_total_usd : cost.total_usd))
      ));
      costTable.appendChild(costTbody);
      costTableWrap.appendChild(costTable);
      costSec.appendChild(costTableWrap);
      costSec.appendChild(el('p', { style: 'font-size: 0.85rem; color: var(--text-dim); margin-top: 0.5rem;' },
        '"This run" is what was billed; answers reused from the local cache are free. "Cold run" prices every call as if nothing was cached — the cost of auditing a new site.'));

      if (cost.note) {
        costSec.appendChild(el('p', { style: 'font-size: 0.85rem; color: var(--text-dim); margin-top: 0.5rem; font-style: italic;' }, `* Note: ${cost.note}`));
      }
      mainEl.appendChild(costSec);
    })();
  </script>
</body>
</html>
