[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qa-agent"
version = "0.1.0"
description = "Autonomous specification-driven QA agent for the DemoBank hackathon target"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.48",
  "pydantic>=2.9",
  "google-genai>=1.0",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
qa-agent = "qa_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["qa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
